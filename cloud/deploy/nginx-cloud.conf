# Облачная среда Codary Code. Сначала ставится только порт 80, затем `certbot --nginx -d @DOMAIN@` дописывает HTTPS.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name @DOMAIN@;
    client_max_body_size 64m;

    location = /enter { proxy_pass http://127.0.0.1:8200; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /wait  { proxy_pass http://127.0.0.1:8200; proxy_set_header Host $host; }

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8200/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Upgrade "";      # запрос на WebSocket не должен превращать проверку доступа в WebSocket
        proxy_set_header Connection "";
    }

    location / {
        auth_request /_auth;
        auth_request_set $cc_upstream $upstream_http_x_upstream;
        error_page 401 = @login;
        error_page 403 = @wait;

        proxy_pass http://$cc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @login { return 302 https://codary.ru/code.php; }
    location @wait  { rewrite ^ /wait break; proxy_pass http://127.0.0.1:8200; proxy_set_header Host $host; proxy_set_header Upgrade ""; proxy_set_header Connection ""; }
}
